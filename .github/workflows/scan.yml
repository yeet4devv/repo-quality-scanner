name: Repo Quality Scanner CI

on:
  push:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Run Repo Quality Scanner (self-check)
        run: npm run scan -- https://github.com/${{ github.repository }} --summary